name: Pipeline

on:
  schedule:
    # After US market close (Mon-Fri 22:30 UTC)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      kind:
        description: "Run kind"
        required: true
        default: "manual"
        type: choice
        options:
          - cron
          - manual
      ticker:
        description: "Single ticker (optional)"
        required: false
        default: ""
      run_id:
        description: "Pre-assigned run ID"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          KIND="${{ github.event.inputs.kind || 'cron' }}"
          TICKER="${{ github.event.inputs.ticker }}"
          RUN_ID="${{ github.event.inputs.run_id }}"

          ARGS="--kind $KIND"
          if [ -n "$TICKER" ]; then
            ARGS="$ARGS --ticker $TICKER"
          fi
          if [ -n "$RUN_ID" ]; then
            ARGS="$ARGS --run-id $RUN_ID"
          fi

          echo "Running: python -m pipeline $ARGS"
          python -m pipeline $ARGS
